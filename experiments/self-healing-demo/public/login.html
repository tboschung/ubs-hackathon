<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UBS e-banking login</title>
<style>
  :root {
    --ubs-red: #EC0016;
    --ink: #101010;
    --muted: #707070;
    --line: #d8d8d8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #ededed;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 16px 34px;
    display: flex;
    align-items: center;
  }
  header img { height: 32px; width: auto; display: block; }
  .tagline {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .card {
    background: #fff;
    width: 100%;
    max-width: 440px;
    padding: 44px 46px 38px;
    border: 1px solid #e3e3e3;
    box-shadow: 0 2px 14px rgba(0,0,0,.07);
  }
  .card h1 {
    font-size: 27px;
    line-height: 1.25;
    margin: 0 0 10px;
    font-weight: 700;
    letter-spacing: -.2px;
  }
  .sub {
    margin: 0 0 30px;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 13px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    border: 1px solid #b4b4b4;
    background: #fff;
    margin-bottom: 20px;
    transition: border-color .15s;
  }
  input::placeholder { color: #b0b0b0; }
  input:focus {
    outline: none;
    border-color: var(--ubs-red);
    box-shadow: 0 0 0 3px rgba(236,0,22,.12);
  }

  button.primary {
    width: 100%;
    padding: 14px;
    font-size: 15.5px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: var(--ubs-red);
    border: none;
    cursor: pointer;
    transition: background .15s;
  }
  button.primary:hover { background: #c70013; }

  .status {
    margin-top: 16px;
    padding: 13px 15px;
    font-size: 13.5px;
    line-height: 1.45;
    font-weight: 700;
    color: var(--ubs-red);
    background: #fdecee;
    border-left: 3px solid var(--ubs-red);
  }
  .status:empty { display: none; }

  .secure {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .secure svg { flex: none; }

  .links {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #ececec;
    font-size: 13.5px;
  }
  .links a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid #c9c9c9;
    display: inline-block;
    margin-bottom: 11px;
  }
  .links a:hover { color: var(--ubs-red); border-color: var(--ubs-red); }
  .links br { line-height: 0; }

  .report {
    display: block;
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: inherit;
    text-align: center;
    text-decoration: none;
    background: #fff;
    color: var(--ubs-red);
    border: 1px solid var(--ubs-red);
    cursor: pointer;
    transition: background .15s;
  }
  .report:hover { background: #fff4f5; }

  footer {
    text-align: center;
    font-size: 12px;
    color: #8a8a8a;
    padding: 22px;
  }
</style>
</head>
<body>

<header>
  <img src="/ubs_logo.png" alt="UBS">
  <span class="tagline">Switzerland &middot; e-banking</span>
</header>

<main>
  <div class="card">
    <h1>Log in to e-banking</h1>
    <p class="sub">Please enter your contract number and password.</p>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <label for="username">Contract number</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="e.g. fcaldas">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••">

      <button type="submit" class="primary">Login</button>
      <div class="status" id="status"></div>
    </form>

    <div class="secure">
      <svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="#707070" stroke-width="1.3">
        <rect x="1" y="6" width="10" height="7" rx="1"/><path d="M3.4 6V4a2.6 2.6 0 0 1 5.2 0v2"/>
      </svg>
      Secured connection &middot; TLS 1.3
    </div>

    <div class="links">
      <a href="#">Forgotten your password?</a><br>
      <a href="#">Open an account</a><br>
      <a href="#">Security information</a>
    </div>

    <a class="report" href="/ticket.html?source=login" target="_blank" rel="noopener">
      See an error? Please report it!
    </a>
  </div>
</main>

<footer>
  &copy; UBS 1998 &ndash; 2026. All rights reserved.
</footer>

<script>
  function handleLogin(event) {
    event.preventDefault();

    var status = document.getElementById('status');
    status.textContent = '';

    try {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;

      if (username === 'fcaldas' && password === '1234') {
        window.location.href = '/ebanking.html';
      } else {
        status.textContent = 'Incorrect contract number or password.';
      }
    } catch (err) {
      status.textContent = 'Something went wrong. Please try again later.';
      console.error('[login] unexpected failure:', err);
    }

    return false;
  }
</script>

</body>
</html>
